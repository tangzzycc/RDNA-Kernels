      .info { font-size: 21px; fill: #393741; }
      .legend { font-size: 19px; fill: #55535f; }
      .math { font-family: 'Times New Roman', 'Liberation Serif', serif; font-style: italic; font-size: 34px; }
      .branch { font-family: 'Times New Roman', 'Liberation Serif', serif; font-style: italic; font-size: 28px; }
      .wire { fill: none; stroke: #111111; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .edge { marker-end: url(#arrow); }
      .expansion { stroke-dasharray: 7 6; }
      .panel { fill: #f9f9f9; stroke: #888888; stroke-width: 2; stroke-dasharray: 7 7; }
      .node { stroke: #111111; stroke-width: 2.2; }
      .linear { fill: #e6e4ef; }
      .norm { fill: #f7ebcf; }
      .attention { fill: #f9f9df; }
      .rope { fill: #f4e6e6; }
      .cache { fill: #eeeeee; }
    </style>
  </defs>
  <rect width="1400" height="1840" fill="#ffffff"/>

