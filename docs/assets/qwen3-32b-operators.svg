<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1840" viewBox="0 0 1400 1840" role="img" aria-labelledby="title description">
  <title id="title">Qwen3-32B operator graph</title>
  <desc id="description">Bottom-to-top inference flow: token embedding, 64 decoder layers, final RMSNorm, LM head and generation sampler. Each decoder layer uses pre-normalized grouped-query attention and a dense SwiGLU MLP with two residual additions. Attention and MLP are expanded in the right panels. Q and K have per-head RMSNorm before RoPE; cached K and V feed attention. Qwen3-32B has hidden size 5120, intermediate size 25600, 64 query heads, 8 KV heads and head dimension 128. Q projection output is 8192; K and V outputs are 1024. The drawing borrows the pastel palette, upward flow, projection trapezoids and dashed panel borders of the supplied Qwen3.5 reference, while retaining Qwen3-32B architecture.</desc>
  <metadata>
    Model configuration: https://huggingface.co/Qwen/Qwen3-32B/blob/main/config.json
    Reference implementation: https://github.com/huggingface/transformers/blob/v4.51.3/src/transformers/models/qwen3/modeling_qwen3.py
    RMSNorm epsilon: 1e-6. RoPE theta: 1000000. BF16 model weights.
    Sampling is part of generation runtime outside the model forward pass.
    Shapes use batch B, current input length S, and total per-sequence KV context length L.
    Attention tensors use head-major layout [B, heads, sequence, head_dim].
    Attention score/probability shapes are logical intermediates; fused backends need not materialize them.
    The sampler selects last-position logits from the sequence logits.
  </metadata>
